name: Frontend build and deploy

on:
  push:
    branches: [master]
    paths: ['client/**', 'package*.json', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['client/**', 'package*.json']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built site to S3 and invalidate CloudFront
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build client
        env:
          # Public value baked into the bundle. Pull requests fall back to a placeholder.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://localhost:3000' }}
        run: npm run build --workspace=client
      - name: Check build output
        run: test -s client/dist/index.html && ls client/dist client/dist/assets
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload to S3
        env:
          BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          set -euo pipefail
          test -s dist/index.html
          # Hashed bundles never change, so cache them for a year.
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --cache-control "public,max-age=31536000,immutable"
          # Other static files (favicon etc.): short cache.
          aws s3 sync dist "s3://$BUCKET" --exclude "index.html" --exclude "assets/*" \
            --cache-control "public,max-age=3600"
          # index.html last, so it only points at files that already exist.
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" --content-type "text/html"
      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          ID=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/index.html" --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$ID"
